[pytest]
# Pytest configuration for Medical AI Agent tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --cov=medical_ai_agent
    --cov-report=html
    --cov-report=term-missing

# Test paths
testpaths = tests

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    requires_redis: Tests that require Redis
    requires_db: Tests that require database connection

# Minimum Python version
minversion = 3.8

# Ignore paths
norecursedirs = .git .tox dist build *.egg

# Timeout for tests (in seconds)
timeout = 300

# Log level
log_cli = true
log_cli_level = INFO

# Async support
asyncio_mode = auto
